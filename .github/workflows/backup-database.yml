name: Backup database

on:
  schedule:
    # 05:00 UTC codziennie - po crony /api/cron/publish (03:00) i /api/cron/refresh-tokens
    # (04:00) z vercel.json, żeby backup łapał wczorajszą aktywność.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Install PostgreSQL client (pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run backup
        env:
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.PROD_BLOB_READ_WRITE_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node scripts/backup-database.mjs
