name: Backup database

on:
  schedule:
    # 05:00 UTC codziennie - po crony /api/cron/publish (03:00) i /api/cron/refresh-tokens
    # (04:00) z vercel.json, żeby backup łapał wczorajszą aktywność.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      # pg_dump refuses to dump a server newer than itself ("aborting because of server
      # version mismatch") - Supabase runs Postgres 17, ubuntu-latest's default
      # postgresql-client package is only 16. Pull client 17 from the official PGDG apt repo
      # instead. Discovered by actually running this workflow against production (TASK-1.1.2),
      # not assumed from reading the Supabase plan alone.
      - name: Install PostgreSQL 17 client (pg_dump/psql)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # ubuntu-latest runners already ship an older postgresql-client (16) on PATH -
          # installing 17 alongside it does not make plain `pg_dump` resolve to 17 unless
          # its versioned bin dir is put first on PATH explicitly.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Run backup
        env:
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.PROD_BLOB_READ_WRITE_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node scripts/backup-database.mjs
