name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowstate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flowstate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No `cache: 'npm'`: ruled out as the cause below, but leaving it off avoids
          # ever restoring a cache from before the npm upgrade this job now does.

      # A run right after adding @playwright/test hit npm's well-known optional-dependencies
      # bug (npm/cli#4828): lightningcss's Linux native binding failed to install with
      # "Cannot find native binding", breaking every page (Next.js build-error overlay
      # instead of real content). Ruled out: the lockfile content (verified byte-identical
      # to a from-scratch reinstall) and actions/setup-node's npm cache (removed above,
      # `npm cache clean --force` added — still failed identically). What's left is the npm
      # version itself: several npm 10.x releases have had exactly this optional-deps bug,
      # fixed in later releases. Force a current npm before installing anything.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm ci

      # tests/setup-env.ts loads a real .env file (process.loadEnvFile) and throws if it's
      # missing, so this has to be an actual file, not just workflow `env:`. Values below are
      # not secrets: nothing in the test suite ever calls out to a real external API (TikTok
      # creator-info is mocked, publish jobs are created with publishNow:false), so JWT_SECRET
      # only needs to be internally consistent for this run, not kept private.
      - name: Create test .env
        run: |
          cat <<'EOF' > .env
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/flowstate?schema=public"
          DIRECT_URL="postgresql://postgres:postgres@localhost:5432/flowstate?schema=public"
          JWT_SECRET="test-only-not-a-real-secret"
          JWT_EXPIRES_IN="3600"
          APP_MODE="personal"
          NODE_ENV="test"
          EOF

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Apply migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Run tests
        run: npm test

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # --with-deps only ran on a cache miss (it installs OS-level shared libraries, not
      # just the browser binary) — a cache hit still needs those present on this runner.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # E2E tests drive a real browser against a real running server (tests/e2e/*.spec.ts
      # exercise the 5 UX_AUDIT.md bugs fixed alongside this workflow change — session
      # timeout/retry, TikTok consent placement, register-status gate, password-flow
      # copy, TikTok creator-info error handling) — Vitest above only covers API/unit
      # level, not what a browser actually renders.
      #
      # A production build (`next build` + `next start`), not `next dev`: dev mode
      # compiles each route on its first hit, and that first-hit latency was enough to
      # flake 2 of the 8 E2E tests here (timing out waiting for content that was still
      # compiling). A prod server has none of that — every route is already built —
      # and it's also just faster to run against (whole suite: ~40s vs ~2min).
      - name: Build app
        run: npm run build

      - name: Start app server
        run: |
          nohup npm run start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time"
          cat server.log
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
