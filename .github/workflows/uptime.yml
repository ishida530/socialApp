name: Uptime check

# Free uptime monitor (2026-10-01): every 10 minutes, checks that production answers and its
# database is reachable (/api/health runs SELECT 1). A failed run makes GitHub email the
# repository owner - no external monitoring account needed.
# Notes: GitHub may delay scheduled runs by a few minutes under load, and disables scheduled
# workflows after 60 days without repository activity (re-enable in the Actions tab).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET https://postfly.pl/api/health
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o body.json -w '%{http_code}' --max-time 20 https://postfly.pl/api/health || echo 000)
            echo "attempt $attempt: HTTP $status $(cat body.json 2>/dev/null)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::postfly.pl/api/health is failing (last HTTP $status)"
          exit 1
